<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vota nas atividades do ano — APAEF</title>
  <meta name="description" content="Escolhe o que queres para cada data do ano letivo 2026/27. Demora 3 minutos. Votação aberta até 25 de outubro.">
  <link rel="canonical" href="https://apaefao.pt/votar.html">
  <meta name="theme-color" content="#ebce58">

  <!-- Pré-visualização ao partilhar (WhatsApp, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="APAEF Fão">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:url" content="https://apaefao.pt/votar.html">
  <meta property="og:title" content="Vota nas atividades da APAEF 🌼">
  <meta property="og:description" content="Escolhe o que queres para cada data do ano. Demora 3 minutos.">
  <meta property="og:image" content="https://apaefao.pt/img/votar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logótipo da APAEF e o texto Vota nas atividades do ano">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="faixa-teste" id="faixa-teste" hidden>Modo teste: os votos ficam só neste aparelho e os números são falsos.</div>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="./"><img src="img/logo.png" alt="Logótipo da APAEF" width="52" height="52"><span>APAEF</span></a>
      <nav>
        <a href="./#agenda">Agenda</a>
        <a href="halloween.html">Halloween</a>
      </nav>
    </div>
  </header>

  <main class="wrap voto-main">
    <div class="voto-topo">
      <h1>Plano de atividades 2026/27 🌼</h1>
      <p>Toca numa data e vota 👍 nas tuas preferidas. <b>Podes votar em até 3 por data.</b> Até 25/10.</p>
      <div class="voto-info"><span id="total">A carregar…</span><span class="envio" id="envio" aria-live="polite"></span></div>
      <p class="faixa-fechada" id="fechada" hidden>Votação fechada — obrigado!</p>
    </div>

    <div id="lista"></div>

    <section class="quem" aria-labelledby="quem-t">
      <h2 id="quem-t">Quem és? <small style="font-weight:600;font-size:14px">(opcional)</small></h2>
      <div class="campos">
        <label class="sr" for="nome" style="position:absolute;left:-9999px">Nome</label>
        <input id="nome" type="text" placeholder="Nome" autocomplete="name" maxlength="80">
        <label for="turma" style="position:absolute;left:-9999px">Turma</label>
        <select id="turma"><option value="">Turma</option></select>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="wrap">Esta página precisa de JavaScript ligado.</p></noscript>
  <script src="js/config.js"></script>
  <script src="js/votar.js"></script>
  <!-- Contador de visitas (GoatCounter: sem cookies) -->
  <script data-goatcounter="https://apaefao.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
